# npm Trusted Publishing (OIDC)。トークンを保存せず、GitHub Actions の身元で publish する。
# 事前に npmjs.com の keiri-core → Settings → Trusted Publisher で
# 「GitHub Actions / fiestared / keiri-core / publish.yml」を登録しておくこと。
#
# 使い方: package.json の version を上げてコミット → `git tag v1.1.3 && git push --tags`
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC。trusted publishing に必須
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing は npm 11.5.1 以降。runner 同梱版は古いことがあるので上げる
      - run: npm install -g npm@latest

      # タグと package.json の version がズレたまま公開する事故を止める
      - name: タグと package.json の version 照合
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::タグ v$TAG と package.json の $PKG が一致しません"; exit 1; }

      - run: npm test

      # README が言及する成果物が公開物に入っているかを、publish 前に確かめる
      # (1.1.0 で files に mcp を入れ忘れ、README だけ「同梱」と書いた事故の再発防止)
      - name: 公開物に mcp/ が入っているか
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            if (!files.includes("mcp/server.mjs")) {
              console.error("::error::公開tarballに mcp/server.mjs が入っていない (package.json の files を確認)");
              process.exit(1);
            }
            console.log("ok: mcp/server.mjs 収録");
          '

      - run: npm publish

      # 公開後、README に書いた起動コマンドを実レジストリからそのまま実行する
      # (1.1.1 で `npx -y keiri-core-mcp` と誤記し、公開するまで気づけなかった事故の再発防止)
      - name: READMEの起動コマンドが実際に動くか
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            sleep 15
            OUT=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              | npx -y -p "keiri-core@$VERSION" keiri-core-mcp 2>/dev/null || true)
            case "$OUT" in
              *"\"version\":\"$VERSION\""*) echo "ok: npx -y -p keiri-core keiri-core-mcp が $VERSION で応答"; exit 0 ;;
            esac
            echo "レジストリ反映待ち ($i/10)"
          done
          echo "::error::公開後、READMEの起動コマンドで $VERSION を起動できなかった"
          exit 1
